name: Build & Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      build_type:
        description: "构建类型"
        required: true
        type: choice
        options:
          - official
          - trial
          - basic
        default: trial

permissions:
  contents: write

# 全局构建类型：tag 推送默认 official，手动触发使用输入值
env:
  BUILD_TYPE: ${{ github.event.inputs.build_type || 'trial' }}
  DURATION: ${{ (github.event.inputs.build_type == 'trial' && '30') || (github.event.inputs.build_type == 'basic' && '7') || '' }}

# 同一 tag 的构建不并发
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ─────────────────────────────────────────────
  # macOS 构建
  # ─────────────────────────────────────────────
  build-macos:
    name: macOS Build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # 防护：将 lockfile 中的私有仓库 URL 替换为公共源，避免 CI 认证失败
      - name: Normalize registry URLs
        run: sed -i '' 's|https://nexus.mcd.com.cn/repository/npm-group/|https://registry.npmjs.org/|g' package-lock.json

      - name: Install dependencies
        run: npm ci

      # 从 tag 名同步版本号到 package.json（forge.config.js 读取 npm_package_version）
      - name: Sync version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm version ${{ github.ref_name }} --no-git-tag-version --allow-same-version

      # 构建：package → ad-hoc 签名 → make（免证书签名，将"已损坏"变为可右键打开）
      - name: Build macOS
        run: |
          # 1. Package
          npx electron-forge package --platform=darwin

          # 2. Ad-hoc sign（codesign -s - 无需开发者证书）
          APP_PATH=$(find out -maxdepth 2 -name "*.app" -type d | head -1)
          if [ -n "$APP_PATH" ]; then
            codesign --force --deep --sign - "$APP_PATH"
            echo "Ad-hoc signed: $APP_PATH"
          else
            echo "::error::未找到 .app 文件"
            exit 1
          fi

          # 3. Make（跳过重新打包，使用已签名的 app 创建 DMG）
          npx electron-forge make --platform=darwin --skip-package

      # 验证产物存在，不存在则终止
      - name: Verify build output
        run: |
          files=$(find out/make -type f 2>/dev/null)
          if [ -z "$files" ]; then
            echo "::error::out/make 中未找到构建产物"
            exit 1
          fi
          echo "=== macOS 构建产物 ==="
          echo "$files"

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: |
            out/make/**/*.dmg
          if-no-files-found: error

  # ─────────────────────────────────────────────
  # Windows 构建
  # ─────────────────────────────────────────────
  build-windows:
    name: Windows Build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # 防护：将 lockfile 中的私有仓库 URL 替换为公共源，避免 CI 认证失败
      - name: Normalize registry URLs
        shell: bash
        run: sed -i 's|https://nexus.mcd.com.cn/repository/npm-group/|https://registry.npmjs.org/|g' package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Sync version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm version ${{ github.ref_name }} --no-git-tag-version --allow-same-version

      # 执行 package.json 中对应的构建命令：npm run build:{BUILD_TYPE}-win
      - name: Build Windows
        shell: bash
        run: npm run build:${BUILD_TYPE}-win

      - name: Verify build output
        shell: bash
        run: |
          files=$(find out/make -type f 2>/dev/null)
          if [ -z "$files" ]; then
            echo "::error::out/make 中未找到构建产物"
            exit 1
          fi
          echo "=== Windows 构建产物 ==="
          echo "$files"

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: |
            out/make/**/*.exe
          if-no-files-found: error

  # ─────────────────────────────────────────────
  # 发布 Release
  # ─────────────────────────────────────────────
  release:
    name: GitHub Release
    needs: [build-macos, build-windows]
    if: >-
      always() &&
      !cancelled() &&
      (needs.build-macos.result == 'success' || needs.build-windows.result == 'success') &&
      needs.build-macos.result != 'failure' &&
      needs.build-windows.result != 'failure'
    runs-on: ubuntu-latest
    steps:
      # 分别下载两个平台的 artifact 到各自目录
      - name: Download macOS artifacts
        if: needs.build-macos.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: macos-build
          path: macos-files

      - name: Download Windows artifacts
        if: needs.build-windows.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: windows-build
          path: windows-files

      # 将所有产物平铺到 release/ 目录（消除子目录层级）
      - name: Collect release files
        run: |
          mkdir -p release
          find macos-files windows-files -type f 2>/dev/null -exec cp {} release/ \;
          echo "=== Release 文件列表 ==="
          ls -lh release/

      # 无文件则终止，防止创建空 Release
      - name: Verify release assets
        run: |
          count=$(find release -type f | wc -l)
          if [ "$count" -eq 0 ]; then
            echo "::error::没有可发布的构建产物"
            exit 1
          fi
          echo "共 $count 个文件待发布"

      # 仅 tag 推送时创建 Release，手动触发只构建不发布
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          body: |
            ## macOS 安装说明

            下载 `.dmg` 安装后，如果提示"已损坏，无法打开"：

            **方式一**：终端执行（推荐）
            ```bash
            xattr -cr "/Applications/Miao积分管理.app"
            ```

            **方式二**：右键点击 App → 选择"打开" → 点击"确定"

            ## Windows 安装说明

            下载 `.exe` 安装包直接运行，如出现 SmartScreen 提示点击"仍要运行"。
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 同步 Release 产物到 Gitee（国内用户下载更快）
      - name: Sync to Gitee Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_OWNER: ${{ secrets.GITEE_OWNER }}
          GITEE_REPO: ${{ secrets.GITEE_REPO }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e

          if [ -z "$GITEE_TOKEN" ]; then
            echo "GITEE_TOKEN 未配置，跳过 Gitee 同步"
            exit 0
          fi

          TAG_NAME="${GITHUB_REF_NAME}"
          API_BASE="https://gitee.com/api/v5/repos/${GITEE_OWNER}/${GITEE_REPO}"
          echo "=== 同步到 Gitee Release: ${API_BASE} ${TAG_NAME} ==="
          echo "API: ${API_BASE}"

          # 0. 确保 Gitee 上存在该 Tag（搜索全部 Tag，不只看第一个）
          TAG_EXISTS=$(curl -s "${API_BASE}/tags?access_token=${GITEE_TOKEN}&per_page=100" | jq -r '.[].name' | grep -Fx "$TAG_NAME" || true)
          if [ -z "$TAG_EXISTS" ]; then
            echo "Gitee 上未找到 Tag ${TAG_NAME}，尝试创建..."
            DEFAULT_BRANCH=$(curl -s "${API_BASE}?access_token=${GITEE_TOKEN}" | jq -r '.default_branch // "master"')
            echo "默认分支: ${DEFAULT_BRANCH}"
            TAG_CREATE=$(curl -s -X POST "${API_BASE}/tags" \
              -H "Content-Type: application/json" \
              -d "{\"access_token\": \"${GITEE_TOKEN}\", \"tag_name\": \"${TAG_NAME}\", \"refs\": \"${DEFAULT_BRANCH}\"}")
            TAG_CREATE_NAME=$(echo "$TAG_CREATE" | jq -r '.name // empty')
            if [ "$TAG_CREATE_NAME" = "$TAG_NAME" ]; then
              echo "Tag ${TAG_NAME} 创建成功"
            elif echo "$TAG_CREATE" | jq -r '.message // empty' | grep -q "已存在"; then
              echo "Tag ${TAG_NAME} 已存在（跳过创建）"
            else
              echo "::warning::Gitee Tag 创建失败: $TAG_CREATE"
              echo "请先手动推送 Tag 到 Gitee: git push gitee ${TAG_NAME}"
              exit 0
            fi
          else
            echo "Tag ${TAG_NAME} 已存在"
          fi

          # 1. 从 GitHub API 获取真实的 Release 资产名称和下载 URL
          GH_API="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          GH_RELEASE=$(curl -s -H "Authorization: token ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "${GH_API}/releases/tags/${TAG_NAME}")
          BODY_LINES=$(echo "$GH_RELEASE" | jq -r '
            "## 下载地址（GitHub Release）\n\n" +
            ([.assets[] | "- [\(.name)](\(.browser_download_url)) (\(.size / 1048576 | floor)M)"] | join("\n")) +
            "\n\n## 安装说明\n\nmacOS: 下载 .dmg 后执行 xattr -cr \"/Applications/Miao积分管理.app\"\nWindows: 下载 .exe 直接安装"
          ')
          echo "Release Body:"
          echo "$BODY_LINES"

          # 2. 创建 Gitee Release（信息页，文件从 GitHub 下载）
          RELEASE_RESPONSE=$(jq -n \
            --arg token "$GITEE_TOKEN" \
            --arg tag "$TAG_NAME" \
            --arg body "$BODY_LINES" \
            '{access_token: $token, tag_name: $tag, name: $tag, body: $body, target_commitish: "master"}' \
            | curl -s --connect-timeout 30 --max-time 60 -X POST "${API_BASE}/releases" \
              -H "Content-Type: application/json" \
              -d @-)

          RELEASE_ID=$(echo "$RELEASE_RESPONSE" | jq -r '.id // empty')
          if [ -z "$RELEASE_ID" ]; then
            echo "::warning::Gitee Release 创建失败"
            echo "API 响应: $RELEASE_RESPONSE"
            exit 0
          fi
          echo "Gitee Release ID: $RELEASE_ID"

          echo "=== Gitee Release 创建完成 ==="
          echo "Gitee: https://gitee.com/${GITEE_OWNER}/${GITEE_REPO}/releases/${RELEASE_ID}"
          echo "GitHub: ${GH_REPO}/releases/tag/${TAG_NAME}"
