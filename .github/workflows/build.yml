name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      build_type:
        description: '构建类型'
        required: true
        type: choice
        options:
          - official
          - trial
          - basic
        default: official

permissions:
  contents: write

# 全局构建类型：tag 推送默认 official，手动触发使用输入值
env:
  BUILD_TYPE: ${{ github.event.inputs.build_type || 'official' }}

# 同一 tag 的构建不并发
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ─────────────────────────────────────────────
  # macOS 构建
  # ─────────────────────────────────────────────
  build-macos:
    name: macOS Build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # 从 tag 名同步版本号到 package.json（forge.config.js 读取 npm_package_version）
      - name: Sync version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm version ${{ github.ref_name }} --no-git-tag-version --allow-same-version

      # 执行 package.json 中对应的构建命令：npm run build:{BUILD_TYPE}-mac
      - name: Build macOS
        run: npm run build:${BUILD_TYPE}-mac

      # 验证产物存在，不存在则终止
      - name: Verify build output
        run: |
          files=$(find out/make -type f 2>/dev/null)
          if [ -z "$files" ]; then
            echo "::error::out/make 中未找到构建产物"
            exit 1
          fi
          echo "=== macOS 构建产物 ==="
          echo "$files"

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: |
            out/make/**/*.dmg
            out/make/**/*.zip
          if-no-files-found: error

  # ─────────────────────────────────────────────
  # Windows 构建
  # ─────────────────────────────────────────────
  build-windows:
    name: Windows Build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm version ${{ github.ref_name }} --no-git-tag-version --allow-same-version

      # 执行 package.json 中对应的构建命令：npm run build:{BUILD_TYPE}-win
      - name: Build Windows
        shell: bash
        run: npm run build:${BUILD_TYPE}-win

      - name: Verify build output
        shell: bash
        run: |
          files=$(find out/make -type f 2>/dev/null)
          if [ -z "$files" ]; then
            echo "::error::out/make 中未找到构建产物"
            exit 1
          fi
          echo "=== Windows 构建产物 ==="
          echo "$files"

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: |
            out/make/**/*.exe
            out/make/**/*.msi
            out/make/**/*.zip
          if-no-files-found: error

  # ─────────────────────────────────────────────
  # 发布 Release
  # ─────────────────────────────────────────────
  release:
    name: GitHub Release
    needs: [build-macos, build-windows]
    if: >-
      always() &&
      !cancelled() &&
      (needs.build-macos.result == 'success' || needs.build-windows.result == 'success') &&
      needs.build-macos.result != 'failure' &&
      needs.build-windows.result != 'failure'
    runs-on: ubuntu-latest
    steps:
      # 分别下载两个平台的 artifact 到各自目录
      - name: Download macOS artifacts
        if: needs.build-macos.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: macos-build
          path: macos-files

      - name: Download Windows artifacts
        if: needs.build-windows.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: windows-build
          path: windows-files

      # 将所有产物平铺到 release/ 目录（消除子目录层级）
      - name: Collect release files
        run: |
          mkdir -p release
          find macos-files windows-files -type f 2>/dev/null -exec cp {} release/ \;
          echo "=== Release 文件列表 ==="
          ls -lh release/

      # 无文件则终止，防止创建空 Release
      - name: Verify release assets
        run: |
          count=$(find release -type f | wc -l)
          if [ "$count" -eq 0 ]; then
            echo "::error::没有可发布的构建产物"
            exit 1
          fi
          echo "共 $count 个文件待发布"

      # 仅 tag 推送时创建 Release，手动触发只构建不发布
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
