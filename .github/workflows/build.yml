name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      build_type:
        description: '构建类型'
        required: true
        type: choice
        options:
          - official
          - trial
        default: official
      platform:
        description: '构建平台'
        required: true
        type: choice
        options:
          - all
          - macos
          - windows
        default: all

permissions:
  contents: write

jobs:
  build-macos:
    name: Build macOS
    runs-on: macos-latest
    if: >
      github.event_name == 'push' ||
      github.event.inputs.platform == 'all' ||
      github.event.inputs.platform == 'macos'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Sync version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm version ${{ github.ref_name }} --no-git-tag-version --allow-same-version

      - name: Build macOS
        run: |
          BUILD_TYPE="${{ github.event.inputs.build_type || 'official' }}"
          if [ "$BUILD_TYPE" = "official" ]; then
            npm run build:official-mac
          else
            npm run build:trial-mac
          fi

      - name: List build output
        run: find out/make -type f || echo "out/make 目录不存在或为空"

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-release
          path: |
            out/make/**/*.dmg
            out/make/**/*.zip
          if-no-files-found: error

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    if: >
      github.event_name == 'push' ||
      github.event.inputs.platform == 'all' ||
      github.event.inputs.platform == 'windows'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Sync version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm version ${{ github.ref_name }} --no-git-tag-version --allow-same-version

      - name: Build Windows
        run: |
          $buildType = "${{ github.event.inputs.build_type || 'official' }}"
          if ($buildType -eq "official") {
            npm run build:official-win
          } else {
            npm run build:trial-win
          }

      - name: List build output
        run: |
          if (Test-Path out/make) { Get-ChildItem -Path out/make -Recurse -File } else { Write-Host "out/make 目录不存在或为空" }

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            out/make/**/*.exe
            out/make/**/*.msi
            out/make/**/*.zip
          if-no-files-found: error

  release:
    name: Create Release
    needs: [build-macos, build-windows]
    if: >
      always() &&
      (needs.build-macos.result == 'success' || needs.build-windows.result == 'success') &&
      needs.build-macos.result != 'failure' &&
      needs.build-windows.result != 'failure'
    runs-on: ubuntu-latest
    steps:
      - name: Prepare release directory
        run: mkdir -p release

      - name: Download macOS artifacts
        if: needs.build-macos.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: macos-release
          path: macos-artifacts

      - name: Download Windows artifacts
        if: needs.build-windows.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: windows-artifacts

      - name: Flatten artifacts for release
        run: |
          find macos-artifacts windows-artifacts -type f 2>/dev/null | while read f; do
            cp "$f" release/
          done
          echo "=== Release 文件列表 ==="
          ls -lh release/ || echo "release 目录为空"

      - name: Verify release assets exist
        run: |
          count=$(find release -type f | wc -l)
          if [ "$count" -eq 0 ]; then
            echo "没有可用的构建产物，请检查上游构建日志"
            exit 1
          fi
          echo "共 $count 个文件待上传"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
